plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}

version = '0.5.0+mc26.2-forge.1'
group = 'team.cagayakegirls.forgeport'
base { archivesName = 'litematica-forge-26.2' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args "--mixin.config=mixins.litematica.json"
        }
        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    // Needed because the project dependency on MaFgLib carries its bundled
    // Conditional Mixin implementation on dev/test classpaths.
    maven {
        url = 'https://maven.fallenbreath.me/releases'
        content { includeGroupAndSubgroups('me.fallenbreath') }
    }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    implementation project(':mafglib')
    // MaFgLib bundles Conditional Mixin at runtime; Forgematica only needs its API to compile.
    compileOnly 'me.fallenbreath:conditional-mixin-forge:0.6.4'
    annotationProcessor "net.minecraftforge:eventbus-validator:${project.eventbus_version}"
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jar', Jar) {
    manifest.attributes['MixinConfigs'] = 'mixins.litematica.json'
}
