name: Build Forge 26.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct Forge source tree
        run: bash scripts/bootstrap-ci.sh

      - name: Build
        run: gradle --no-daemon --stacktrace build

      - name: Collect build diagnostics
        if: always()
        run: |
          mkdir -p ci-output
          find . -path '*/build/reports/*' -type f -print -exec cp --parents '{}' ci-output/ \; || true

      - name: Prepare installable release files
        if: success()
        run: |
          set -euo pipefail
          mkdir -p release

          LITEMATICA_JAR="$(find forgematica/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-slim.jar' | head -n 1)"
          MAFGLIB_JAR="$(find mafglib/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-slim.jar' | head -n 1)"

          test -n "$LITEMATICA_JAR"
          test -n "$MAFGLIB_JAR"

          cp "$LITEMATICA_JAR" release/
          cp "$MAFGLIB_JAR" release/

          (
            cd release
            sha256sum *.jar > SHA256SUMS.txt
          )

          echo "Release files:"
          ls -lh release

      - name: Upload Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: litematica-forge-26.2-jars
          if-no-files-found: error
          path: release/

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="forge-26.2-build-${GITHUB_RUN_NUMBER}"
          TITLE="Litematica Forge 26.2 build #${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/*.jar release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "Successful Java 25 build for Minecraft 26.2 + Forge 65.1.0. Install both JARs from this release. MaFgLib includes the bundled Conditional Mixin dependency."

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-diagnostics
          if-no-files-found: ignore
          path: ci-output/
