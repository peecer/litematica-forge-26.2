name: Build Forge 26.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-26.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct Forge source tree
        run: bash scripts/bootstrap-ci.sh

      - name: Deep source audit
        run: python3 tools/deep_audit.py

      - name: Build
        run: gradle --no-daemon --stacktrace build

      - name: Install headless graphics runtime
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-utils
          fi

      - name: Smoke launch Minecraft client
        run: bash scripts/smoke-client.sh

      - name: Smoke-test actual Forge client startup
        if: success()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf forgematica/run/logs mafglib/run/logs
          mkdir -p smoke-output

          set +e
          timeout --signal=INT --kill-after=20s 150s xvfb-run -a             gradle --no-daemon --stacktrace :forgematica:runClient             > smoke-output/runClient-console.log 2>&1
          code=$?
          set -e

          echo "runClient exit code: $code"

          if [ -f forgematica/run/logs/latest.log ]; then
            cp forgematica/run/logs/latest.log smoke-output/latest.log
          fi

          # A timeout means the client stayed alive for the full smoke window.
          if [ "$code" -eq 124 ] || [ "$code" -eq 130 ]; then
            echo "Client stayed alive for the smoke-test window."
            exit 0
          fi

          # A clean exit is also acceptable.
          if [ "$code" -eq 0 ]; then
            echo "Client exited cleanly."
            exit 0
          fi

          echo "Forge client exited early; treating this as a runtime failure."
          tail -n 250 smoke-output/runClient-console.log || true
          if [ -f smoke-output/latest.log ]; then
            echo "----- latest.log tail -----"
            tail -n 250 smoke-output/latest.log || true
          fi
          exit "$code"

      - name: Collect build diagnostics
        if: always()
        run: |
          mkdir -p ci-output
          find . -path '*/build/reports/*' -type f -print -exec cp --parents '{}' ci-output/ \; || true
          if [ -f PORT_AUDIT.md ]; then cp PORT_AUDIT.md ci-output/; fi

      - name: Prepare installable release files
        if: success()
        run: |
          set -euo pipefail
          mkdir -p release

          LITEMATICA_JAR="$(find forgematica/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-slim.jar' | head -n 1)"
          MAFGLIB_JAR="$(find mafglib/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-slim.jar' | head -n 1)"

          test -n "$LITEMATICA_JAR"
          test -n "$MAFGLIB_JAR"

          cp "$LITEMATICA_JAR" release/
          cp "$MAFGLIB_JAR" release/

          (
            cd release
            sha256sum *.jar > SHA256SUMS.txt
          )

          echo "Release files:"
          ls -lh release

      - name: Verify packaged JARs
        if: success()
        run: |
          set -euo pipefail
          for jar in release/*.jar; do
            echo "Checking $jar"
            unzip -tq "$jar"
            unzip -l "$jar" | grep -q 'META-INF/mods.toml'
            unzip -l "$jar" | grep -q 'META-INF/accesstransformer.cfg'
            unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'MixinConfigs:'
          done
          unzip -l release/mafglib-*.jar | grep -q 'META-INF/jarjar/conditional-mixin-forge-0.6.4.jar'

      - name: Upload Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: litematica-forge-26.2-jars
          if-no-files-found: error
          path: release/

      - name: Publish GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="forge-26.2-build-${GITHUB_RUN_NUMBER}"
          TITLE="Litematica Forge 26.2 build #${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/*.jar release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "Passed deep source audit, Java 25 build, package validation, and bounded headless Minecraft client smoke launch for Minecraft 26.2 + Forge 65.1.0. Install both JARs."

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-diagnostics
          if-no-files-found: ignore
          path: |
            ci-output/
            smoke-output/
